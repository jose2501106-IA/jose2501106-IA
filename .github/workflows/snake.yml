name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b  # v3.5.0 (fijada por commit)
        with:
          github_user_name: jose2501106-IA
          # Paleta del portafolio: versión clara y oscura (el README elige según el tema de GitHub)
          outputs: |
            dist/github-snake.svg?color_snake=#0046B8&color_dots=#EBF0F8,#C9D4E8,#9DB3DE,#5A84D6,#0046B8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#8FB4FF&color_dots=#161B22,#14306A,#1F4E9E,#4F7FD6,#8FB4FF

      - name: Push the content of dist/ to the output branch
        uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd  # v3.1.0 (fijada por commit)
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}